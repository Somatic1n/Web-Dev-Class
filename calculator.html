<!DOCTYPE html>
<html lang="en">
<head>
		<title>Add 2 Numbers</title>
        <link rel="stylesheet" href="css/custom1.css">

			<script>

				function addTwo(num1, num2)
				{
				   var total;
				   total = num1 + num2;
				   document.getElementById("answer").innerHTML = "The sum is " + total;  
				}

			</script>
</head>
<body onload="FirstNum.select()">
    <div class="container">
        <div class="row justify-content-center"> 
            <div class="col-md-4">

                <input type = "text" class="input form-control"  id = "FirstNum" size="20"/><br/>
	            <input type = "text"  id = "SecondNum" size="20"/><br/>

	            <button class="btn btn-primary" type="button" onclick= "addTwo(Number(FirstNum.value), Number(SecondNum.value))">Add 2 Numbers</button>
	     
	            <span id="answer"></span>
            </div>
        </div>
    </div>
</body>
</html>
