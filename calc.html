<!DOCTYPE html>
<html lang="en">
<head>
		<title>Add 2 Numbers</title>
        <link rel="stylesheet" href="css/custom1.css">

			<script>

				function addTwo(num1, num2)
				{
				   var total;
				   if (isNaN(num1) || isNaN(num2))
				   {
					document.getElementById("answer").innerHTML = "Please Enter a Valid Number.";
					return;
				   }
				   total = num1 + num2;
				   document.getElementById("answer").innerHTML = "The sum is " + total;  
				}
				
				function minusTwo(num1, num2)
				{
					var total;
					if (isNaN(num1) || isNaN(num2))
				   {
					document.getElementById("answer").innerHTML = "Please Enter a Valid Number.";
					return;
				   }
					total = num1 - num2
					document.getElementById("answer").innerHTML = "The difference is " + total;
				}

				function multiplyTwo(num1, num2)
				{
					var total;
					if (isNaN(num1) || isNaN(num2))
				   {
					document.getElementById("answer").innerHTML = "Please Enter a Valid Number.";
					return;
				   }
					total = num1 * num2
					document.getElementById("answer").innerHTML = "The product is " + total;
				}

				function divideTwo(num1, num2)
				{
					var total;
					if (isNaN(num1) || isNaN(num2))
				   {
					document.getElementById("answer").innerHTML = "Please Enter a Valid Number.";
					return;
				   }
					total = num1 / num2
					document.getElementById("answer").innerHTML = "The quotient is " + total;
				}

			</script>
</head>
<body onload="FirstNum.select()">
	<div class="bg-success">
    <div class="container d-flex align-items-center min-vh-100">
        <div class="row justify-content-center w-100">
			<h1 class="col-12 text-center text-white fw-bold mb-4">Calculator</h1>
            <div class="col-md-4 text-center">

                <input type = "text" class="input form-control"  id = "FirstNum" placeholder="First number"/><br/>
	            <input type = "text" class="input form-control"  id = "SecondNum" placeholder="Second number"/><br/>


	            <div class="d-flex gap-2 bg-white rounded shadow p-2">
	                <button class="btn btn-primary flex-fill" type="button" onclick= "addTwo(Number(FirstNum.value), Number(SecondNum.value))">+</button>
	                <button class="btn btn-primary flex-fill" type="button" onclick= "minusTwo(Number(FirstNum.value), Number(SecondNum.value))">-</button>
	                <button class="btn btn-primary flex-fill" type="button" onclick= "multiplyTwo(Number(FirstNum.value), Number(SecondNum.value))">*</button>
	                <button class="btn btn-primary flex-fill" type="button" onclick= "divideTwo(Number(FirstNum.value), Number(SecondNum.value))">/</button>
	            </div>

				

	            <span id="answer" class="d-block mt-4 fs-4 fw-bold text-white"></span>
            </div>
        </div>
    </div>
	</div>
</body>
</html>
