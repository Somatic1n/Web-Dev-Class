<!DOCTYPE html>
<html lang="en">
<head>
<meta content='width=device-width, initial-scale=1' name='viewport'>
<link href="/css/custom1.css" rel="stylesheet"> 
<title>Guessing Game</title>
</head>
<body onload="myGuess.select()">
   <div class="container-fluid d-flex align-items-center min-vh-100 bg-primary">
	<div class="row justify-content-center w-100">
		<div class="col-md-4 text-white">
		    <h1 class="display-3">Guessing Game</h1>
		    
	        <span class="mt-2" id="myFeedback">&nbsp;</span>

		    <label class="form-label text-white" for="myGuess">Guess a number (between 1 and 500)</label> 
		    <input id="myGuess" class="form-control" type="text" placeholder="Enter a Number"/><br />

		    <button id="mybutton" class="btn btn-info btn-success text-white" onclick="check()" type="button">Guess</button>
		</div>
	</div>
	 <div class="modal fade" id="WinModal" aria-hidden="true" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered"> 
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" >You Won!</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
					Play Again or Exit
			</div>
			<div class="modal-footer">
					<button type="button" class="btn d-flex gap-2 rounded shadow p-2 bg-success text-white" onclick="location.reload()">Play Again</button>
					<button type="button" class="btn d-flex gap-2 rounded shadow p-2 bg-danger text-white" onclick="location.href = 'index.html'">Exit</button>
			</div>
		</div>
  </div>
   </div>
   <div class="modal fade" id="LoseModal" aria-hidden="true" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered"> 
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" >You Lost!</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
					Play Again or Exit
			</div>
			<div class="modal-footer">
					<button type="button" class="btn d-flex gap-2 rounded shadow p-2 bg-success text-white" onclick="location.reload()">Play Again</button>
					<button type="button" class="btn d-flex gap-2 rounded shadow p-2 bg-danger text-white" onclick="location.href = 'index.html'">Exit</button>
			</div>
		</div>
  </div>
   </div>
   <div class="modal fade" id="WrongNum" aria-hidden="true" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered"> 
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" >Please Enter a Number Between 1 - 500</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
					Play Again or Exit
			</div>
			<div class="modal-footer">
					<button type="button" class="btn d-flex gap-2 rounded shadow p-2 bg-success text-white" onclick="location.reload()">Play Again</button>
					<button type="button" class="btn d-flex gap-2 rounded shadow p-2 bg-danger text-white" onclick="location.href = 'index.html'">Exit</button>
			</div>
		</div>
  </div>
   </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
      <script>
		function popupWin()
		{
			var myModal = new bootstrap.Modal(document.getElementById("WinModal"))
      		myModal.show();
		}
		function popupLose()
		{
			var myModal = new bootstrap.Modal(document.getElementById("LoseModal"))
      		myModal.show();
		}
		function popupWrong()
		{
			var myModal = new bootstrap.Modal(document.getElementById("WrongNum"))
      		myModal.show();
		}
			var randomNum =	Math.round(Math.random() * 499) + 1; //Global variable - value 1-100
    		document.title = "Guessing Game " + randomNum;  //cheat!	
			var guesses = 0; //Global variable
			function check(){
				if (isNaN(myGuess.value) || myGuess.value==0)
				   {
					popupWrong();
				   }
				else{
					check_it();
				}

			}
				function check_it()
			{
			   guesses++;
			   if (randomNum == myGuess.value)  //Correct!
		       {
 			        if(guesses == 1)
 			        	myFeedback.innerHTML ="Way to go! You guessed it in " + guesses + " try!";
 			        else
   			           myFeedback.innerHTML ="Way to go! You guessed it in " + guesses + " tries!";
					popupWin();
 		       }   
			   else  //Wrong!
      			{
      			    if (randomNum < myGuess.value) 
      		        {
		     			   myFeedback.innerHTML = "Too high!";
		     		}
		   			else
		 			{
 	            		   myFeedback.innerHTML = "Too low!";
 	                }
 	           }         
 		 	   myGuess.select();
        	}

		</script>
</body>
</html>
