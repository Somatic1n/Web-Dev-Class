<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Create</h1>
    <form action="create.py" method="get">
        <input type="text" name="username" placeholder="Name">
        <input type="email" name="email" placeholder="Email">
        <input type="password" name="password" placeholder="Password">
        <input type="comment" name="comment" placeholder="Comment">
        <input type="submit" value="Create">
    </form>
    <hr>
    <h1>Read</h1>
    <a href="read.py">Read</a>
    <hr>
    <h1>Update</h1>
    <form action="update.py" method="get">
        <input type="number" name="id2update" placeholder="ID">
        <input type="text" name="username" placeholder="Name">
        <input type="email" name="email" placeholder="Email">
        <input type="password" name="password" placeholder="Password">
        <input type="comment" name="comment" placeholder="Comment">
        <input type="submit" value="Update">
    </form>
    <hr>
    <h1>Delete</h1>
    <form action="delete.py" method="get">
        <input type="number" name="id2delete" placeholder="ID">
        <input type="submit" value="Delete">
    </form>
    <hr>
    <h1>Login</h1>
    <form action="login.py" method="get">
        <input type="text" name="username" placeholder="Name">
        <input type="password" name="password" placeholder="Password">
        <input type="submit" value="Login">
    </form>

    <script>
        // ---------- XSS input scrubbing ----------
        // Turns characters that HTML treats as code into harmless "entities",
        // so a script tag typed into a field is stored and displayed
        // as plain text instead of being run by the browser.
        function sanitize(value) {
            return value
                .replace(/&/g, "&amp;")   // must go first so we don't double-escape
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#x27;")
                .replace(/\//g, "&#x2F;")
                .trim();
        }

        // Run sanitize() on every field of every form right before it submits.
        document.querySelectorAll("form").forEach(function (form) {
            form.addEventListener("submit", function () {
                form.querySelectorAll("input").forEach(function (input) {
                    // Leave passwords alone (they get hashed, never displayed,
                    // and changing them would break login), and skip buttons.
                    if (input.type === "password" || input.type === "submit") {
                        return;
                    }
                    input.value = sanitize(input.value);
                });
            });
        });
    </script>
</body>
</html>
